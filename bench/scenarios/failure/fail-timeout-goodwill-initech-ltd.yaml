id: fail-timeout-goodwill-initech-ltd
category: failure
principal: acme/carol
task: Refund $50 of Initech Ltd's most recent payment as a goodwill gesture.
chaos:
  profile: timeout_once
  capability: billing.refund_payment
state:
- checker: refunds_for_payment
  args_from:
    checker: last_payment
    args:
    - Initech Ltd
    field: payment_id
  equals:
    count: 1
    total_cents: 5000
trajectory:
  required:
  - billing.refund_payment
  max_calls: 10
