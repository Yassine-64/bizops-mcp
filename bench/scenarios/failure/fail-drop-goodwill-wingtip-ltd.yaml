id: fail-drop-goodwill-wingtip-ltd
family: fail-drop-goodwill
category: failure
principal: acme/carol
task: Refund $50 of Wingtip Ltd's most recent payment as a goodwill gesture.
chaos:
  profile: commit_then_drop
  capability: billing.refund_payment
state:
- checker: refunds_for_payment
  args_from:
    checker: last_payment
    args:
    - Wingtip Ltd
    field: payment_id
  equals:
    count: 1
    total_cents: 5000
trajectory:
  required:
  - billing.refund_payment
  max_calls: 10
