[project]
name = "bizops"
version = "0.1.0"
description = "An evaluated, multi-tenant control plane for AI agents acting across business systems: dynamic capability discovery, server-side policy, approvals, durable idempotent execution, and BizOpsBench."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Yassine Mazhar" }]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "typer>=0.12",
    "pyyaml>=6",
    "mcp>=2.3",
    "bm25s>=0.2",
]

[project.optional-dependencies]
anthropic = ["anthropic>=1.0"]
otel = ["opentelemetry-sdk>=1.28", "opentelemetry-exporter-otlp>=1.28"]
all = ["bizops[anthropic,otel]"]

[project.scripts]
bizops = "bizops.interfaces.cli.main:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bizops"]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests", "bench"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "N"]
ignore = ["N818"]

[tool.ruff.lint.per-file-ignores]
"src/bizops/interfaces/**" = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
files = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["integration: end-to-end through the MCP server or the bench harness"]

[tool.coverage.run]
source = ["bizops"]
